name: FQT Fetch Freqtrade Wheelhouse 20260808

on:
  push:
    paths:
      - '.github/workflows/fqt-fetch-freqtrade-wheels-20260808.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact runtime wheels
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=77cabd291fa656ec6a1d237cfa524ee792133d89
          curl -fsSL --retry 4 --retry-delay 2 -o src.tar.gz "https://github.com/freqtrade/freqtrade/archive/${COMMIT}.tar.gz"
          tar -xzf src.tar.gz
          cd freqtrade-${COMMIT}
          python -m pip install --upgrade pip
          mkdir -p ../wheelhouse
          python -m pip download --only-binary=:all: --dest ../wheelhouse -r requirements.txt
          cd ..
          tar -czf freqtrade-wheelhouse-cp312.tar.gz wheelhouse
          sha256sum freqtrade-wheelhouse-cp312.tar.gz > freqtrade-wheelhouse-cp312.tar.gz.sha256
      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-wheelhouse-cp312
          path: |
            freqtrade-wheelhouse-cp312.tar.gz
            freqtrade-wheelhouse-cp312.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
# trigger 2
