name: FQT Binance holdout bridge 20260723

on:
  push:
    paths:
      - '.github/workflows/fqt-binance-holdout-20260723.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  download-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download, verify, package and split official Binance data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bridge artifacts/fqt-binance-holdout-20260623-20260722
          mkdir -p bridge artifacts/fqt-binance-holdout-20260623-20260722
          cat > bridge/download_holdout.py <<'PY'
          from __future__ import annotations
          import concurrent.futures as cf
          import csv
          import hashlib
          import json
          import pathlib
          import re
          import shutil
          import tarfile
          import time
          import urllib.error
          import urllib.request
          import zipfile
          from datetime import date, timedelta

          PAIRS = [
              'BTCUSDC','LINKUSDC','SEIUSDC','ALGOUSDC','ENAUSDC','ZKUSDC','AVAXUSDC',
              'LUNCUSDC','THEUSDC','SYRUPUSDC','PIXELUSDC','PARTIUSDC','DOLOUSDC',
              'EIGENUSDC','MINAUSDC','SAHARAUSDC','BERAUSDC','FORMUSDC','SNXUSDC',
              'FILUSDC','CGPTUSDC','VANRYUSDC','SYNUSDC','PNUTUSDC','ACHUSDC',
              'DOGSUSDC','COMPUSDC','ZAMAUSDC','TRXUSDC','HOLOUSDC','BIOUSDC',
          ]
          START = date(2026, 6, 23)
          END = date(2026, 7, 22)
          WORK = pathlib.Path('bridge/work')
          CSVROOT = WORK / 'csv'
          RAW = WORK / 'raw'
          OUT = pathlib.Path('artifacts/fqt-binance-holdout-20260623-20260722')
          CSVROOT.mkdir(parents=True, exist_ok=True)
          RAW.mkdir(parents=True, exist_ok=True)
          OUT.mkdir(parents=True, exist_ok=True)
          BASE = 'https://data.binance.vision/data/spot/daily/klines/{symbol}/1m/{symbol}-1m-{day}.zip'
          UA = 'FQT-holdout-audit/1.0'

          def day_strings():
              d = START
              while d <= END:
                  yield d.isoformat()
                  d += timedelta(days=1)

          def fetch(url: str, dest: pathlib.Path, attempts: int = 5) -> tuple[bool, str]:
              last = ''
              for n in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA})
                      with urllib.request.urlopen(req, timeout=90) as response, open(dest, 'wb') as target:
                          shutil.copyfileobj(response, target)
                      return True, ''
                  except urllib.error.HTTPError as exc:
                      last = f'HTTP {exc.code}'
                      if exc.code == 404:
                          return False, last
                  except Exception as exc:
                      last = f'{type(exc).__name__}: {exc}'
                  time.sleep(min(12.0, 1.7 ** n))
              return False, last

          def process(task: tuple[str, str]) -> dict:
              symbol, day = task
              pair_raw = RAW / symbol
              pair_csv = CSVROOT / symbol
              pair_raw.mkdir(parents=True, exist_ok=True)
              pair_csv.mkdir(parents=True, exist_ok=True)
              name = f'{symbol}-1m-{day}.zip'
              zpath = pair_raw / name
              cpath = pair_raw / f'{name}.CHECKSUM'
              url = BASE.format(symbol=symbol, day=day)
              rec = {'symbol': symbol, 'day': day, 'url': url, 'status': 'missing', 'error': '',
                     'bytes': 0, 'sha256': '', 'expected_sha256': '', 'rows': 0}
              ok, err = fetch(url, zpath)
              if not ok:
                  rec['error'] = err
                  return rec
              okc, errc = fetch(url + '.CHECKSUM', cpath)
              if not okc:
                  rec.update(status='checksum_missing', error=errc, bytes=zpath.stat().st_size)
                  return rec
              text = cpath.read_text(encoding='utf-8', errors='replace').strip()
              match = re.search(r'([0-9a-fA-F]{64})', text)
              if not match:
                  rec.update(status='checksum_parse_fail', error=text[:200], bytes=zpath.stat().st_size)
                  return rec
              expected = match.group(1).lower()
              actual = hashlib.sha256(zpath.read_bytes()).hexdigest()
              rec.update(bytes=zpath.stat().st_size, sha256=actual, expected_sha256=expected)
              if actual != expected:
                  rec.update(status='checksum_fail', error='sha256 mismatch')
                  return rec
              try:
                  with zipfile.ZipFile(zpath) as archive:
                      bad = archive.testzip()
                      if bad:
                          rec.update(status='zip_crc_fail', error=bad)
                          return rec
                      members = [member for member in archive.namelist() if member.lower().endswith('.csv')]
                      if len(members) != 1:
                          rec.update(status='zip_shape_fail', error=f'csv members={members}')
                          return rec
                      out = pair_csv / pathlib.Path(members[0]).name
                      with archive.open(members[0]) as source, open(out, 'wb') as target:
                          shutil.copyfileobj(source, target)
                  with open(out, 'rb') as handle:
                      rows = sum(1 for _ in handle)
                  rec.update(status='ok', rows=rows)
                  return rec
              except Exception as exc:
                  rec.update(status='extract_fail', error=f'{type(exc).__name__}: {exc}')
                  return rec

          tasks = [(symbol, day) for symbol in PAIRS for day in day_strings()]
          records: list[dict] = []
          with cf.ThreadPoolExecutor(max_workers=16) as executor:
              for index, rec in enumerate(executor.map(process, tasks), 1):
                  records.append(rec)
                  if index % 50 == 0 or rec['status'] != 'ok':
                      print(f'{index}/{len(tasks)} {rec["symbol"]} {rec["day"]} {rec["status"]}', flush=True)

          records.sort(key=lambda item: (item['symbol'], item['day']))
          package = WORK / 'package' / 'binance_holdout_20260623_20260722'
          package.mkdir(parents=True, exist_ok=True)
          shutil.move(str(CSVROOT), str(package / 'csv'))
          manifest = {
              'source': 'Binance Public Data',
              'source_base': 'https://data.binance.vision',
              'dataset': 'spot/daily/klines/1m',
              'requested_start': START.isoformat(),
              'requested_end': END.isoformat(),
              'pairs': PAIRS,
              'records': records,
          }
          (package / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          with open(package / 'manifest.csv', 'w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(records[0].keys()))
              writer.writeheader()
              writer.writerows(records)
          summary = {}
          for symbol in PAIRS:
              selected = [r for r in records if r['symbol'] == symbol]
              summary[symbol] = {
                  'requested_days': len(selected),
                  'ok_days': sum(r['status'] == 'ok' for r in selected),
                  'rows': sum(int(r['rows']) for r in selected if r['status'] == 'ok'),
                  'non_ok': [{'day': r['day'], 'status': r['status'], 'error': r['error']}
                             for r in selected if r['status'] != 'ok'],
              }
          (package / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')

          archive_path = WORK / 'binance_holdout_20260623_20260722.tar.gz'
          with tarfile.open(archive_path, 'w:gz', compresslevel=9) as archive:
              archive.add(package, arcname=package.name)
          full_sha = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          part_size = 80 * 1024 * 1024
          parts = []
          with open(archive_path, 'rb') as source:
              number = 0
              while True:
                  payload = source.read(part_size)
                  if not payload:
                      break
                  name = f'binance_holdout_20260623_20260722.tar.gz.part{number:03d}'
                  path = OUT / name
                  path.write_bytes(payload)
                  parts.append({'name': name, 'bytes': len(payload),
                                'sha256': hashlib.sha256(payload).hexdigest()})
                  number += 1
          parts_manifest = {
              'archive_name': archive_path.name,
              'archive_bytes': archive_path.stat().st_size,
              'archive_sha256': full_sha,
              'part_size': part_size,
              'parts': parts,
              'downloaded_files': sum(r['status'] == 'ok' for r in records),
              'missing_files': sum(r['status'] == 'missing' for r in records),
              'integrity_failures': sum(r['status'] not in {'ok', 'missing'} for r in records),
          }
          (OUT / 'parts_manifest.json').write_text(json.dumps(parts_manifest, indent=2), encoding='utf-8')
          (OUT / 'README.md').write_text(
              '# Temporary FQT Binance holdout\n\n'
              'Official Binance Public Data daily spot 1m archives, SHA256-verified before extraction.\n'
              'Reassemble parts in lexical order and verify `archive_sha256` in `parts_manifest.json`.\n',
              encoding='utf-8')
          failures = [r for r in records if r['status'] not in {'ok', 'missing'}]
          print(json.dumps(parts_manifest, indent=2), flush=True)
          if failures:
              raise SystemExit(f'integrity failures: {len(failures)}')
          PY
          python bridge/download_holdout.py

      - name: Commit temporary verified holdout parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fqt-holdout-bot'
          git config user.email 'fqt-holdout-bot@users.noreply.github.com'
          git add artifacts/fqt-binance-holdout-20260623-20260722
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add temporary verified Binance holdout data'
            git push origin HEAD:main
          fi
