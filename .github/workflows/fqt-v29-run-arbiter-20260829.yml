name: FQT V29 Single-Run Arbiter 20260829

on:
  workflow_dispatch:
  push:
    branches:
      - fqt-v29-performance-factory-20260829
    paths:
      - '.github/workflows/fqt-v29-run-arbiter-20260829.yml'

permissions:
  actions: write
  contents: read

jobs:
  arbitrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep newest V29 factory run and cancel all older active duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: fqt-v29-performance-factory-20260829.yml
          BRANCH: fqt-v29-performance-factory-20260829
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          repo=os.environ['REPO']; workflow=os.environ['WORKFLOW']; branch=os.environ['BRANCH']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch={branch}&per_page=50'
          req=urllib.request.Request(url,headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent':'FQT-V29-single-run-arbiter',
              'X-GitHub-Api-Version':'2022-11-28',
          })
          with urllib.request.urlopen(req,timeout=30) as response:
              runs=json.load(response).get('workflow_runs',[])
          active=[r for r in runs if r.get('status') in {'queued','in_progress','waiting','pending','requested'}]
          if not active:
              print('No active V29 factory runs.')
              raise SystemExit(0)
          active.sort(key=lambda r:r['id'],reverse=True)
          keep=active[0]
          print(json.dumps({'keep':keep['id'],'active':[r['id'] for r in active]},indent=2))
          for run in active[1:]:
              endpoint=f'/repos/{repo}/actions/runs/{run["id"]}/cancel'
              subprocess.run(['gh','api','--method','POST',endpoint],check=True)
              print(f'cancelled {run["id"]}')
          PY
