name: FQT IP08 Callback Prefix Harness V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback-prefix-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fqt-rnd-v23-next-20260814

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Reproduce frozen champion and native trade ledger
        shell: bash
        run: |
          set -euo pipefail
          chmod +x fqt_ip04a/run_ip04a_v2.sh
          fqt_ip04a/run_ip04a_v2.sh 2>&1 | tee ip08_setup.log

      - name: Execute callback prefix causality harness
        id: run
        shell: bash
        run: |
          set +e
          result=evidence/IP04A_CONTINUOUS_RUN1.zip
          python fqt_ip08/callback_prefix_harness.py \
            --strategy user_data/strategies/M4PioneerStableExposureV10.py \
            --config config_ip04.json \
            --result "$result" \
            --out evidence/IP08_CALLBACK_PREFIX_RESULT.json \
            --max-trades 60 \
            --future-candles 1440 \
            2>&1 | tee evidence/ip08_callback_prefix.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package IP08 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp -f ip08_setup.log evidence/ 2>/dev/null || true
          tar -czf FQT_IP08_CALLBACK_PREFIX_RETURN_V1.tar.gz evidence
          sha256sum FQT_IP08_CALLBACK_PREFIX_RETURN_V1.tar.gz \
            > FQT_IP08_CALLBACK_PREFIX_RETURN_V1.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fqt-ip08-callback-prefix-return-v1
          path: |
            FQT_IP08_CALLBACK_PREFIX_RETURN_V1.tar.gz
            FQT_IP08_CALLBACK_PREFIX_RETURN_V1.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Enforce prefix subgate
        if: always()
        run: test "${{ steps.run.outputs.rc }}" = "0"
