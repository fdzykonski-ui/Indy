name: FQT Binance OOS 20260805

on:
  push:
    paths:
      - '.github/workflows/fqt-binance-oos-20260805.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fetch-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify official Binance daily 1m archives
        shell: bash
        run: |
          set -euo pipefail
          PAIRS=(BTCUSDC LINKUSDC SEIUSDC ALGOUSDC ENAUSDC ZKUSDC AVAXUSDC LUNCUSDC THEUSDC SYRUPUSDC PIXELUSDC PARTIUSDC DOLOUSDC EIGENUSDC MINAUSDC SAHARAUSDC BERAUSDC FORMUSDC SNXUSDC FILUSDC CGPTUSDC VANRYUSDC SYNUSDC PNUTUSDC ACHUSDC DOGSUSDC COMPUSDC ZAMAUSDC TRXUSDC HOLOUSDC SXTUSDC)
          DATES=(2026-07-28 2026-07-29 2026-07-30 2026-07-31 2026-08-01 2026-08-02 2026-08-03 2026-08-04)
          ROOT="$PWD/fqt_binance_oos_20260728_20260804"
          mkdir -p "$ROOT/zips" "$ROOT/csv"
          : > "$ROOT/downloaded.tsv"
          : > "$ROOT/missing.tsv"
          : > "$ROOT/integrity_failures.tsv"
          for pair in "${PAIRS[@]}"; do
            mkdir -p "$ROOT/zips/$pair" "$ROOT/csv/$pair"
            for day in "${DATES[@]}"; do
              name="${pair}-1m-${day}.zip"
              base="https://data.binance.vision/data/spot/daily/klines/${pair}/1m/${name}"
              if curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 20 -o "$ROOT/zips/$pair/$name" "$base" && \
                 curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 20 -o "$ROOT/zips/$pair/$name.CHECKSUM" "$base.CHECKSUM"; then
                if (cd "$ROOT/zips/$pair" && sha256sum -c "$name.CHECKSUM"); then
                  unzip -q -p "$ROOT/zips/$pair/$name" > "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/downloaded.tsv"
                else
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/integrity_failures.tsv"
                  rm -f "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                fi
              else
                printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/missing.tsv"
                rm -f "$ROOT/zips/$pair/$name" "$ROOT/zips/$pair/$name.CHECKSUM"
              fi
            done
          done
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('fqt_binance_oos_20260728_20260804')
          def rows(name):
              p = root / name
              if not p.exists():
                  return []
              return [line.rstrip('\n').split('\t') for line in p.read_text().splitlines() if line.strip()]
          csv_files = sorted((root / 'csv').glob('*/*.csv'))
          manifest = {
              'source': 'https://data.binance.vision/data/spot/daily/klines',
              'dates': ['2026-07-28','2026-07-29','2026-07-30','2026-07-31','2026-08-01','2026-08-02','2026-08-03','2026-08-04'],
              'pair_count': 31,
              'expected_files': 248,
              'downloaded_files': len(rows('downloaded.tsv')),
              'missing_files': len(rows('missing.tsv')),
              'integrity_failures': len(rows('integrity_failures.tsv')),
              'csv_files': len(csv_files),
              'files': []
          }
          for p in csv_files:
              manifest['files'].append({
                  'path': str(p.relative_to(root)),
                  'bytes': p.stat().st_size,
                  'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
              })
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps({k: manifest[k] for k in ('expected_files','downloaded_files','missing_files','integrity_failures','csv_files')}, indent=2))
          if manifest['missing_files'] or manifest['integrity_failures'] or manifest['csv_files'] != manifest['expected_files']:
              raise SystemExit('OOS archive set incomplete')
          PY
          tar -czf fqt-binance-oos-20260728-20260804.tar.gz "$ROOT"
          sha256sum fqt-binance-oos-20260728-20260804.tar.gz > fqt-binance-oos-20260728-20260804.tar.gz.sha256

      - name: Upload verified OOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqt-binance-oos-20260728-20260804
          path: |
            fqt-binance-oos-20260728-20260804.tar.gz
            fqt-binance-oos-20260728-20260804.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
