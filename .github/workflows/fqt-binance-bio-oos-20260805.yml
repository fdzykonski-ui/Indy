name: FQT Binance BIO OOS 20260805

on:
  push:
    paths:
      - '.github/workflows/fqt-binance-bio-oos-20260805.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-bio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify BIOUSDC daily 1m archives
        shell: bash
        run: |
          set -euo pipefail
          PAIR=BIOUSDC
          DATES=(2026-07-28 2026-07-29 2026-07-30 2026-07-31 2026-08-01 2026-08-02 2026-08-03)
          ROOT="$PWD/fqt_binance_bio_oos_20260728_20260803"
          mkdir -p "$ROOT/zips/$PAIR" "$ROOT/csv/$PAIR"
          : > "$ROOT/downloaded.tsv"
          for day in "${DATES[@]}"; do
            name="${PAIR}-1m-${day}.zip"
            base="https://data.binance.vision/data/spot/daily/klines/${PAIR}/1m/${name}"
            curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 20 -o "$ROOT/zips/$PAIR/$name" "$base"
            curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 20 -o "$ROOT/zips/$PAIR/$name.CHECKSUM" "$base.CHECKSUM"
            (cd "$ROOT/zips/$PAIR" && sha256sum -c "$name.CHECKSUM")
            unzip -q -p "$ROOT/zips/$PAIR/$name" > "$ROOT/csv/$PAIR/${PAIR}-1m-${day}.csv"
            printf '%s\t%s\t%s\n' "$PAIR" "$day" "$name" >> "$ROOT/downloaded.tsv"
          done
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('fqt_binance_bio_oos_20260728_20260803')
          files=sorted((root/'csv').glob('*/*.csv'))
          m={'source':'https://data.binance.vision/data/spot/daily/klines','pair':'BIOUSDC','dates':['2026-07-28','2026-07-29','2026-07-30','2026-07-31','2026-08-01','2026-08-02','2026-08-03'],'expected_files':7,'downloaded_files':len(files),'missing_files':0,'integrity_failures':0,'files':[]}
          for p in files:
              m['files'].append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          if len(files)!=7: raise SystemExit('BIO OOS set incomplete')
          PY
          tar -czf fqt-binance-bio-oos-20260728-20260803.tar.gz "$ROOT"
          sha256sum fqt-binance-bio-oos-20260728-20260803.tar.gz > fqt-binance-bio-oos-20260728-20260803.tar.gz.sha256

      - name: Upload verified BIO OOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqt-binance-bio-oos-20260728-20260803
          path: |
            fqt-binance-bio-oos-20260728-20260803.tar.gz
            fqt-binance-bio-oos-20260728-20260803.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
