name: FQT M21 DuckDB CLI Bootstrap 20260816

on:
  push:
    paths:
      - '.github/workflows/fqt-m21-duckdb-cli-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire and verify official DuckDB CLI
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip'
          EXPECTED='08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05'
          curl -fsSL --retry 4 --retry-delay 2 -o duckdb_cli.zip "$URL"
          echo "$EXPECTED  duckdb_cli.zip" | sha256sum -c -
          unzip -q duckdb_cli.zip -d duckdb_cli
          chmod +x duckdb_cli/duckdb
          duckdb_cli/duckdb --version | tee duckdb_version.txt
          sha256sum duckdb_cli.zip duckdb_cli/duckdb > SHA256SUMS.txt
      - name: Upload DuckDB CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqt-m21-duckdb-cli-v1-5-5-glibc
          path: |
            duckdb_cli.zip
            duckdb_cli/duckdb
            duckdb_version.txt
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
