name: FQT PIT Warmup 20260811

on:
  push:
    paths:
      - '.github/workflows/fqt-pit-warmup-20260811.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit-warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Probe and acquire verified Binance 2025-12-31 1m archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/fqt_pit_warmup_20251231"
          mkdir -p "$ROOT/zips" "$ROOT/csv"
          : > "$ROOT/status.tsv"
          curl -fsSL --retry 3 --retry-delay 2 'https://api.binance.com/api/v3/exchangeInfo' -o "$ROOT/exchangeInfo_current.json" || printf '{"symbols":[]}' > "$ROOT/exchangeInfo_current.json"
          while read -r pair; do
            [ -n "$pair" ] || continue
            name="${pair}-1m-2025-12-31.zip"
            base="https://data.binance.vision/data/spot/daily/klines/${pair}/1m/${name}"
            mkdir -p "$ROOT/zips/$pair" "$ROOT/csv/$pair"
            if curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 20 -o "$ROOT/zips/$pair/$name" "$base" && \
               curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 20 -o "$ROOT/zips/$pair/$name.CHECKSUM" "$base.CHECKSUM"; then
              if (cd "$ROOT/zips/$pair" && sha256sum -c "$name.CHECKSUM" >/dev/null); then
                if unzip -q -p "$ROOT/zips/$pair/$name" > "$ROOT/csv/$pair/${pair}-1m-2025-12-31.csv"; then
                  printf '%s\tVERIFIED\n' "$pair" >> "$ROOT/status.tsv"
                else
                  printf '%s\tEXTRACTION_FAIL\n' "$pair" >> "$ROOT/status.tsv"
                fi
              else
                printf '%s\tCHECKSUM_FAIL\n' "$pair" >> "$ROOT/status.tsv"
              fi
            else
              printf '%s\tMISSING\n' "$pair" >> "$ROOT/status.tsv"
              rm -f "$ROOT/zips/$pair/$name" "$ROOT/zips/$pair/$name.CHECKSUM"
            fi
          done < fqt_tmp/pit_pairs_20260811.txt
          python - <<'PY'
          import csv, json, pathlib, datetime
          root=pathlib.Path('fqt_pit_warmup_20251231')
          statuses={}
          for line in (root/'status.tsv').read_text().splitlines():
              if line.strip():
                  p,s=line.split('\t',1); statuses[p]=s
          try:
              ex=json.loads((root/'exchangeInfo_current.json').read_text())
          except Exception:
              ex={'symbols':[]}
          current={x.get('symbol'):x for x in ex.get('symbols',[])}
          rows=[]
          target=datetime.datetime(2025,12,31,5,40,tzinfo=datetime.timezone.utc)
          def dt_from_raw(v):
              x=int(v)
              if x > 10**15: sec=x/1_000_000
              elif x > 10**12: sec=x/1000
              else: sec=x
              return datetime.datetime.fromtimestamp(sec,tz=datetime.timezone.utc)
          for pair in pathlib.Path('fqt_tmp/pit_pairs_20260811.txt').read_text().splitlines():
              if not pair.strip(): continue
              st=statuses.get(pair,'UNKNOWN')
              csvp=root/'csv'/pair/f'{pair}-1m-2025-12-31.csv'
              n=0; first=None; last=None; monotonic=True; dup=0; prev=None; seen=set()
              if st=='VERIFIED' and csvp.exists():
                  with csvp.open(newline='') as f:
                      r=csv.reader(f)
                      for rec in r:
                          if not rec: continue
                          try: dt=dt_from_raw(rec[0])
                          except Exception: continue
                          n+=1
                          if first is None: first=dt
                          last=dt
                          if prev is not None and dt < prev: monotonic=False
                          if dt in seen: dup+=1
                          seen.add(dt); prev=dt
              info=current.get(pair,{})
              eligible=bool(st=='VERIFIED' and n>=1100 and first and last and first <= target and last >= datetime.datetime(2025,12,31,23,59,tzinfo=datetime.timezone.utc) and monotonic and dup==0)
              rows.append({
                  'symbol':pair,'archive_status':st,'rows_20251231':n,
                  'first_20251231':first.isoformat() if first else '',
                  'last_20251231':last.isoformat() if last else '',
                  'monotonic':monotonic if n else '', 'duplicates':dup if n else '',
                  'eligible_before_20260101_warmup':eligible,
                  'current_status':info.get('status','NOT_IN_CURRENT_EXCHANGEINFO'),
                  'current_spot_allowed':info.get('isSpotTradingAllowed',''),
                  'current_quoteAsset':info.get('quoteAsset','')
              })
          with (root/'PIT_PAIR_ELIGIBILITY_LEDGER.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          m={
              'source':'Binance Vision spot daily klines + Binance API exchangeInfo',
              'historical_probe_date':'2025-12-31','warmup_target_start':'2025-12-31T05:40:00+00:00',
              'startup_candle_count':1100,'universe_count':len(rows),
              'verified_archives':sum(r['archive_status']=='VERIFIED' for r in rows),
              'eligible_count':sum(bool(r['eligible_before_20260101_warmup']) for r in rows),
              'checksum_failures':sum(r['archive_status']=='CHECKSUM_FAIL' for r in rows),
              'extraction_failures':sum(r['archive_status']=='EXTRACTION_FAIL' for r in rows),
              'rows':rows
          }
          (root/'PIT_PAIRSET_MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps({k:m[k] for k in ['universe_count','verified_archives','eligible_count','checksum_failures','extraction_failures']},indent=2))
          if m['checksum_failures'] or m['extraction_failures']:
              raise SystemExit('Integrity failure in Binance archive acquisition')
          PY
          tar -czf fqt-pit-warmup-20251231.tar.gz "$ROOT"
          sha256sum fqt-pit-warmup-20251231.tar.gz > fqt-pit-warmup-20251231.tar.gz.sha256
      - name: Upload PIT warmup artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqt-pit-warmup-20251231
          path: |
            fqt-pit-warmup-20251231.tar.gz
            fqt-pit-warmup-20251231.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
