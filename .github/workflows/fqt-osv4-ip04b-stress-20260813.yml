name: FQT OSV4 IP04B Continuous Stress Matrix 20260813
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scenario: [fee002, fee003, delay1, delay2, protections_on, mot1, mot3, stake200, wallet500, wallet2000]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Run scenario
        shell: bash
        run: |
          set -euo pipefail
          chmod +x fqt_ip04b/run_scenario.sh
          fqt_ip04b/run_scenario.sh '${{ matrix.scenario }}'
      - name: Package scenario evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf 'FQT_IP04B_${{ matrix.scenario }}_20260813.tar.gz' evidence
          sha256sum 'FQT_IP04B_${{ matrix.scenario }}_20260813.tar.gz' > 'FQT_IP04B_${{ matrix.scenario }}_20260813.tar.gz.sha256'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'fqt-ip04b-${{ matrix.scenario }}-20260813'
          path: |
            FQT_IP04B_${{ matrix.scenario }}_20260813.tar.gz
            FQT_IP04B_${{ matrix.scenario }}_20260813.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
