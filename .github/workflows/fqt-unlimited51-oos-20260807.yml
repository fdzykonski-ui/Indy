name: FQT Unlimited51 OOS 20260807

on:
  push:
    paths:
      - '.github/workflows/fqt-unlimited51-oos-20260807.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download and verify official Binance daily 1m archives
        shell: bash
        run: |
          set -euo pipefail
          PAIRS=(BTCUSDC LINKUSDC SEIUSDC ALGOUSDC ENAUSDC ZKUSDC AVAXUSDC LUNCUSDC THEUSDC SYRUPUSDC PIXELUSDC PARTIUSDC DOLOUSDC EIGENUSDC MINAUSDC SAHARAUSDC BERAUSDC FORMUSDC SNXUSDC FILUSDC CGPTUSDC VANRYUSDC SYNUSDC PNUTUSDC ACHUSDC DOGSUSDC COMPUSDC ZAMAUSDC TRXUSDC HOLOUSDC SXTUSDC EPICUSDC ILVUSDC CATIUSDC BIOUSDC COTIUSDC MITOUSDC REDUSDC HYPERUSDC STXUSDC PHAUSDC ORCAUSDC REZUSDC ATUSDC ETHFIUSDC SAGAUSDC NILUSDC VETUSDC ALLOUSDC GIGGLEUSDC USUALUSDC)
          DATES=(2026-08-05 2026-08-06)
          ROOT="$PWD/fqt_unlimited51_oos_20260805_20260806"
          mkdir -p "$ROOT/zips" "$ROOT/csv"
          : > "$ROOT/downloaded.tsv"
          : > "$ROOT/missing.tsv"
          : > "$ROOT/integrity_failures.tsv"
          for pair in "${PAIRS[@]}"; do
            mkdir -p "$ROOT/zips/$pair" "$ROOT/csv/$pair"
            for day in "${DATES[@]}"; do
              name="${pair}-1m-${day}.zip"
              base="https://data.binance.vision/data/spot/daily/klines/${pair}/1m/${name}"
              if curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 20 -o "$ROOT/zips/$pair/$name" "$base" && \
                 curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 20 -o "$ROOT/zips/$pair/$name.CHECKSUM" "$base.CHECKSUM"; then
                if (cd "$ROOT/zips/$pair" && sha256sum -c "$name.CHECKSUM"); then
                  unzip -q -p "$ROOT/zips/$pair/$name" > "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/downloaded.tsv"
                else
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/integrity_failures.tsv"
                  rm -f "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                fi
              else
                printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/missing.tsv"
                rm -f "$ROOT/zips/$pair/$name" "$ROOT/zips/$pair/$name.CHECKSUM"
              fi
            done
          done
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('fqt_unlimited51_oos_20260805_20260806')
          files=sorted((root/'csv').glob('*/*.csv'))
          def lines(name):
              p=root/name
              return [x for x in p.read_text().splitlines() if x.strip()] if p.exists() else []
          m={'source':'https://data.binance.vision/data/spot/daily/klines','created_for':'FQT Unlimited-51 screening only','dates':['2026-08-05','2026-08-06'],'pair_count':51,'expected_files':102,'downloaded_files':len(lines('downloaded.tsv')),'missing_files':len(lines('missing.tsv')),'integrity_failures':len(lines('integrity_failures.tsv')),'csv_files':len(files),'files':[]}
          for p in files:
              m['files'].append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps({k:m[k] for k in ('expected_files','downloaded_files','missing_files','integrity_failures','csv_files')},indent=2))
          if m['missing_files'] or m['integrity_failures'] or m['csv_files'] != m['expected_files']:
              raise SystemExit('Unlimited51 OOS archive set incomplete')
          PY
          tar -czf fqt-unlimited51-oos-20260805-20260806.tar.gz "$ROOT"
          sha256sum fqt-unlimited51-oos-20260805-20260806.tar.gz > fqt-unlimited51-oos-20260805-20260806.tar.gz.sha256

      - name: Upload verified OOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqt-unlimited51-oos-20260805-20260806
          path: |
            fqt-unlimited51-oos-20260805-20260806.tar.gz
            fqt-unlimited51-oos-20260805-20260806.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
