name: FQT M3R42 OOS Regression 20260807

on:
  push:
    paths:
      - '.github/workflows/fqt-m3r42-oos-regression-20260807.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify official Binance daily 1m archives
        shell: bash
        run: |
          set -euo pipefail
          PAIRS=(BTCUSDC LINKUSDC SEIUSDC ALGOUSDC ENAUSDC ZKUSDC AVAXUSDC LUNCUSDC THEUSDC SYRUPUSDC PIXELUSDC PARTIUSDC DOLOUSDC EIGENUSDC MINAUSDC SAHARAUSDC BERAUSDC FORMUSDC SNXUSDC FILUSDC CGPTUSDC VANRYUSDC SYNUSDC PNUTUSDC ACHUSDC DOGSUSDC COMPUSDC ZAMAUSDC TRXUSDC HOLOUSDC SXTUSDC DASHUSDC COWUSDC DOTUSDC BONKUSDC CFXUSDC ALTUSDC APEUSDC ALLOUSDC ERAUSDC CETUSUSDC ASTERUSDC 2ZUSDC BANANAS31USDC ATOMUSDC DYDXUSDC AVNTUSDC AAVEUSDC BCHUSDC DOGEUSDC BNBUSDC)
          DATES=(2026-07-28 2026-07-29 2026-07-30 2026-07-31 2026-08-01 2026-08-02 2026-08-03 2026-08-04 2026-08-05 2026-08-06)
          ROOT="$PWD/fqt_m3r42_oos_20260728_20260806"
          mkdir -p "$ROOT/zips" "$ROOT/csv"
          : > "$ROOT/downloaded.tsv"
          : > "$ROOT/missing.tsv"
          : > "$ROOT/integrity_failures.tsv"
          for pair in "${PAIRS[@]}"; do
            mkdir -p "$ROOT/zips/$pair" "$ROOT/csv/$pair"
            for day in "${DATES[@]}"; do
              name="${pair}-1m-${day}.zip"
              base="https://data.binance.vision/data/spot/daily/klines/${pair}/1m/${name}"
              if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$ROOT/zips/$pair/$name" "$base" && curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$ROOT/zips/$pair/$name.CHECKSUM" "$base.CHECKSUM"; then
                if (cd "$ROOT/zips/$pair" && sha256sum -c "$name.CHECKSUM"); then
                  unzip -q -p "$ROOT/zips/$pair/$name" > "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/downloaded.tsv"
                else
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/integrity_failures.tsv"
                  rm -f "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                fi
              else
                printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/missing.tsv"
                rm -f "$ROOT/zips/$pair/$name" "$ROOT/zips/$pair/$name.CHECKSUM"
              fi
            done
          done
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('fqt_m3r42_oos_20260728_20260806')
          pairs='BTCUSDC LINKUSDC SEIUSDC ALGOUSDC ENAUSDC ZKUSDC AVAXUSDC LUNCUSDC THEUSDC SYRUPUSDC PIXELUSDC PARTIUSDC DOLOUSDC EIGENUSDC MINAUSDC SAHARAUSDC BERAUSDC FORMUSDC SNXUSDC FILUSDC CGPTUSDC VANRYUSDC SYNUSDC PNUTUSDC ACHUSDC DOGSUSDC COMPUSDC ZAMAUSDC TRXUSDC HOLOUSDC SXTUSDC DASHUSDC COWUSDC DOTUSDC BONKUSDC CFXUSDC ALTUSDC APEUSDC ALLOUSDC ERAUSDC CETUSUSDC ASTERUSDC 2ZUSDC BANANAS31USDC ATOMUSDC DYDXUSDC AVNTUSDC AAVEUSDC BCHUSDC DOGEUSDC BNBUSDC'.split()
          dates='2026-07-28 2026-07-29 2026-07-30 2026-07-31 2026-08-01 2026-08-02 2026-08-03 2026-08-04 2026-08-05 2026-08-06'.split()
          files=sorted((root/'csv').glob('*/*.csv'))
          complete={d:all((root/'csv'/p/f'{p}-1m-{d}.csv').exists() for p in pairs) for d in dates}
          manifest={'source':'https://data.binance.vision/data/spot/daily/klines','classification':'KNOWN_CONSUMED_OOS_REGRESSION_NOT_FINAL_HOLDOUT','pair_count':len(pairs),'pairs':pairs,'requested_dates':dates,'complete_dates':complete,'expected_files':len(pairs)*len(dates),'downloaded_files':len(files),'missing_files':sum(1 for x in (root/'missing.tsv').read_text().splitlines() if x.strip()),'integrity_failures':sum(1 for x in (root/'integrity_failures.tsv').read_text().splitlines() if x.strip()),'files':[]}
          for p in files:
              manifest['files'].append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({k:manifest[k] for k in ('expected_files','downloaded_files','missing_files','integrity_failures','complete_dates')},indent=2))
          if manifest['integrity_failures'] or not any(complete.values()): raise SystemExit('No usable complete OOS day')
          PY
          tar -czf fqt-m3r42-oos-regression-20260728-20260806.tar.gz "$ROOT"
          sha256sum fqt-m3r42-oos-regression-20260728-20260806.tar.gz > fqt-m3r42-oos-regression-20260728-20260806.tar.gz.sha256
      - name: Upload verified OOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqt-m3r42-oos-regression-20260728-20260806
          path: |
            fqt-m3r42-oos-regression-20260728-20260806.tar.gz
            fqt-m3r42-oos-regression-20260728-20260806.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
