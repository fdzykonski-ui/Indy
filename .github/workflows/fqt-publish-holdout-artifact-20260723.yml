name: FQT publish verified holdout artifact 20260723

on:
  push:
    paths:
      - '.github/workflows/fqt-publish-holdout-artifact-20260723.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/fqt-binance-holdout-20260623-20260722'
          mkdir -p bridge
          cat "$SRC"/binance_holdout_20260623_20260722.tar.gz.part* > bridge/binance_holdout_20260623_20260722.tar.gz
          python - <<'PY'
          import hashlib, json, pathlib
          src=pathlib.Path('artifacts/fqt-binance-holdout-20260623-20260722')
          manifest=json.loads((src/'parts_manifest.json').read_text())
          archive=pathlib.Path('bridge/binance_holdout_20260623_20260722.tar.gz')
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive.stat().st_size == manifest['archive_bytes'], (archive.stat().st_size, manifest['archive_bytes'])
          assert digest == manifest['archive_sha256'], (digest, manifest['archive_sha256'])
          pathlib.Path('bridge/archive_sha256.txt').write_text(f'{digest}  {archive.name}\n')
          print({'bytes': archive.stat().st_size, 'sha256': digest})
          PY

      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: fqt-binance-holdout-20260623-20260722
          path: |
            bridge/binance_holdout_20260623_20260722.tar.gz
            bridge/archive_sha256.txt
            artifacts/fqt-binance-holdout-20260623-20260722/parts_manifest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Publish run locator
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('artifacts/fqt-binance-holdout-20260623-20260722/run_info.json')
          p.write_text(json.dumps({
            'run_id': int(os.environ['RUN_ID']),
            'run_attempt': int(os.environ['RUN_ATTEMPT']),
            'workflow_sha': os.environ['RUN_SHA'],
            'artifact_name': 'fqt-binance-holdout-20260623-20260722'
          }, indent=2) + '\n')
          PY
          git config user.name 'fqt-holdout-bot'
          git config user.email 'fqt-holdout-bot@users.noreply.github.com'
          git add artifacts/fqt-binance-holdout-20260623-20260722/run_info.json
          git commit -m 'Publish FQT holdout artifact run locator'
          git push origin HEAD:main
