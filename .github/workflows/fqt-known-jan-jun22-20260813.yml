name: FQT Known Jan-Jun22 Continuous 20260813
on:
  push:
    branches:
      - fqt-known-jan-jun22-20260813
    paths:
      - '.github/workflows/fqt-known-jan-jun22-20260813.yml'
      - 'fqt_known_janjun/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  known:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Run continuous known Jan-Jun22 validation
        id: run
        shell: bash
        run: |
          set +e
          chmod +x fqt_known_janjun/run_known_janjun.sh
          fqt_known_janjun/run_known_janjun.sh 2>&1 | tee known_janjun_console.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package known-period evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp -f known_janjun_console.log evidence/ 2>/dev/null || true
          tar -czf FQT_KNOWN_JAN_JUN22_RETURN_20260813.tar.gz evidence
          sha256sum FQT_KNOWN_JAN_JUN22_RETURN_20260813.tar.gz > FQT_KNOWN_JAN_JUN22_RETURN_20260813.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fqt-known-jan-jun22-return-20260813
          path: |
            FQT_KNOWN_JAN_JUN22_RETURN_20260813.tar.gz
            FQT_KNOWN_JAN_JUN22_RETURN_20260813.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Enforce known-period runner outcome
        if: always()
        shell: bash
        run: test "${{ steps.run.outputs.rc }}" = "0"
