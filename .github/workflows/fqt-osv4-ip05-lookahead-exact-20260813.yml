name: FQT OSV4 IP05 Full Lookahead Exact 20260813
on:
  push:
    branches:
      - fqt-ip05-lookahead-exact-20260813
    paths:
      - '.github/workflows/fqt-osv4-ip05-lookahead-exact-20260813.yml'
      - 'fqt_ip05/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookahead:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Execute exact continuous setup and full lookahead analysis
        id: run
        shell: bash
        run: |
          set +e
          chmod +x fqt_ip05/run_lookahead.sh
          fqt_ip05/run_lookahead.sh 2>&1 | tee ip05_console.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package IP05 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp -f ip05_console.log evidence/ 2>/dev/null || true
          tar -czf FQT_OSV4_IP05_LOOKAHEAD_RETURN_20260813.tar.gz evidence
          sha256sum FQT_OSV4_IP05_LOOKAHEAD_RETURN_20260813.tar.gz > FQT_OSV4_IP05_LOOKAHEAD_RETURN_20260813.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fqt-osv4-ip05-lookahead-return-20260813
          path: |
            FQT_OSV4_IP05_LOOKAHEAD_RETURN_20260813.tar.gz
            FQT_OSV4_IP05_LOOKAHEAD_RETURN_20260813.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Enforce lookahead verdict
        if: always()
        shell: bash
        run: test "${{ steps.run.outputs.rc }}" = "0"
