name: FQT OSV4 IP04C Execution Cost Proxy 20260813
on:
  push:
    branches:
      - fqt-ip04c-slippage-exact-20260813
    paths:
      - '.github/workflows/fqt-osv4-ip04c-slippage-exact-20260813.yml'
      - 'fqt_ip04c/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        scenario: [fee0012, fee0015]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Run exact cost proxy
        id: run
        shell: bash
        run: |
          set +e
          chmod +x fqt_ip04c/run_slippage.sh
          fqt_ip04c/run_slippage.sh '${{ matrix.scenario }}' 2>&1 | tee 'cost_${{ matrix.scenario }}_console.log'
          rc=${PIPESTATUS[0]}; echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp -f 'cost_${{ matrix.scenario }}_console.log' evidence/ 2>/dev/null || true
          tar -czf 'FQT_IP04C_${{ matrix.scenario }}_20260813.tar.gz' evidence
          sha256sum 'FQT_IP04C_${{ matrix.scenario }}_20260813.tar.gz' > 'FQT_IP04C_${{ matrix.scenario }}_20260813.tar.gz.sha256'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'fqt-ip04c-${{ matrix.scenario }}-20260813'
          path: |
            FQT_IP04C_${{ matrix.scenario }}_20260813.tar.gz
            FQT_IP04C_${{ matrix.scenario }}_20260813.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Enforce outcome
        if: always()
        shell: bash
        run: test "${{ steps.run.outputs.rc }}" = "0"
