name: FQT V26 Pioneer Factory 41-Pair OOS50 Committed 20260827
on:
  push:
    branches:
      - fqt-v26-pioneer-factory-20260827
    paths:
      - '.github/workflows/fqt-v26-pioneer-factory-oos50-committed-20260827.yml'
      - 'fqt_v26/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  pioneer-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fqt-v26-pioneer-factory-20260827
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install system prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip patch jq libgomp1
      - name: Execute fail-closed 41-pair factory
        id: execute
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          chmod +x fqt_v26/run_v26.sh
          fqt_v26/run_v26.sh "$PWD/fqt_v26_work" 2>&1 | tee FQT_V26_CONSOLE.log
          rc=${PIPESTATUS[0]}
          echo "driver_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "$rc" > FQT_V26_DRIVER_EXIT_CODE.txt
          exit 0
      - name: Package emergency evidence on driver failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/fqt_v26_work"
          if [ ! -f "$ROOT/FQT_V26_PIONEER_FACTORY_RETURN.zip" ]; then
            mkdir -p "$ROOT/emergency"
            cp FQT_V26_CONSOLE.log FQT_V26_DRIVER_EXIT_CODE.txt "$ROOT/emergency/" || true
            find "$ROOT/evidence" "$ROOT/logs" "$ROOT/release" "$ROOT/summaries" -type f -maxdepth 8 -print0 2>/dev/null | xargs -0 -r cp --parents -t "$ROOT/emergency" || true
            (cd "$ROOT/emergency" && zip -q -r ../FQT_V26_PIONEER_FACTORY_RETURN.zip .)
            sha256sum "$ROOT/FQT_V26_PIONEER_FACTORY_RETURN.zip" > "$ROOT/FQT_V26_PIONEER_FACTORY_RETURN.zip.sha256"
          fi
      - name: Upload complete return
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fqt-v26-pioneer-factory-committed-return-20260827
          path: |
            fqt_v26_work/FQT_V26_PIONEER_FACTORY_RETURN.zip
            fqt_v26_work/FQT_V26_PIONEER_FACTORY_RETURN.zip.sha256
            fqt_v26_work/release/summary.json
            fqt_v26_work/release/M4PioneerV26Final.py
            fqt_v26_work/release/config_M4PioneerV26Final.json
            fqt_v26_work/release/COMPARISON_5x8.csv
            fqt_v26_work/release/GATE_MATRIX.csv
            fqt_v26_work/release/CHAT_LOG_BLOCK.txt
            FQT_V26_CONSOLE.log
            FQT_V26_DRIVER_EXIT_CODE.txt
          retention-days: 3
          if-no-files-found: warn
      - name: Commit compact machine-readable status
        if: always()
        shell: bash
        env:
          DRIVER_RC: ${{ steps.execute.outputs.driver_rc }}
        run: |
          set -euo pipefail
          mkdir -p fqt_v26_results
          python - <<'PY'
          import datetime,json,os,pathlib,shutil,hashlib
          root=pathlib.Path('fqt_v26_work'); out=pathlib.Path('fqt_v26_results')
          status={
            'contract':'FQT_V26_COMMITTED_WORKFLOW_STATUS_V1',
            'created_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'driver_rc':int(os.environ.get('DRIVER_RC') or 999),
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'summary_present':(root/'release/summary.json').exists(),
            'return_zip_present':(root/'FQT_V26_PIONEER_FACTORY_RETURN.zip').exists(),
          }
          if (root/'FQT_V26_PIONEER_FACTORY_RETURN.zip').exists():
            p=root/'FQT_V26_PIONEER_FACTORY_RETURN.zip'; status['return_zip_sha256']=hashlib.sha256(p.read_bytes()).hexdigest(); status['return_zip_bytes']=p.stat().st_size
          (out/'WORKFLOW_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          copies=[
            (root/'release/summary.json',out/'summary.json'),
            (root/'release/M4PioneerV26Final.py',out/'M4PioneerV26Final.py'),
            (root/'release/config_M4PioneerV26Final.json',out/'config_M4PioneerV26Final.json'),
            (root/'release/COMPARISON_5x8.csv',out/'COMPARISON_5x8.csv'),
            (root/'release/GATE_MATRIX.csv',out/'GATE_MATRIX.csv'),
            (root/'release/CHAT_LOG_BLOCK.txt',out/'CHAT_LOG_BLOCK.txt'),
            (root/'evidence/validation/SELECTION_FINAL.json',out/'SELECTION_FINAL.json'),
            (root/'evidence/correctness/CORRECTNESS_SUMMARY.json',out/'CORRECTNESS_SUMMARY.json'),
            (root/'evidence/data/UNIVERSE_41_SELECTION.json',out/'UNIVERSE_41_SELECTION.json'),
          ]
          for src,dst in copies:
            if src.exists(): shutil.copy2(src,dst)
          console=pathlib.Path('FQT_V26_CONSOLE.log')
          if console.exists(): (out/'CONSOLE_TAIL.log').write_text('\n'.join(console.read_text(errors='replace').splitlines()[-500:])+'\n')
          PY
          git config user.name 'FQT Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fqt_v26_results
          if ! git diff --cached --quiet; then
            git commit -m "FQT V26: publish compact execution status $GITHUB_RUN_ID"
            git push origin HEAD:fqt-v26-pioneer-factory-20260827
          fi
      - name: Enforce driver integrity
        if: always()
        shell: bash
        run: |
          test "${{ steps.execute.outputs.driver_rc }}" = "0"
          test -f fqt_v26_work/release/summary.json
          test -f fqt_v26_work/FQT_V26_PIONEER_FACTORY_RETURN.zip
