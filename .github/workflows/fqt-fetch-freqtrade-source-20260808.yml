name: FQT Fetch Freqtrade Source 20260808

on:
  push:
    paths:
      - '.github/workflows/fqt-fetch-freqtrade-source-20260808.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact Freqtrade commit source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=77cabd291fa656ec6a1d237cfa524ee792133d89
          URL="https://github.com/freqtrade/freqtrade/archive/${COMMIT}.tar.gz"
          curl -fsSL --retry 4 --retry-delay 2 -o freqtrade-${COMMIT}.tar.gz "$URL"
          sha256sum freqtrade-${COMMIT}.tar.gz > freqtrade-${COMMIT}.tar.gz.sha256
          tar -tzf freqtrade-${COMMIT}.tar.gz >/dev/null
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-77cabd291-source
          path: |
            freqtrade-77cabd291fa656ec6a1d237cfa524ee792133d89.tar.gz
            freqtrade-77cabd291fa656ec6a1d237cfa524ee792133d89.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
