name: FQT Binance fresh holdout 20260728

on:
  push:
    paths:
      - '.github/workflows/fqt-binance-fresh-holdout-20260728.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch and verify official Binance archives
        shell: bash
        run: |
          set -euo pipefail
          PAIRS=(BTCUSDC LINKUSDC SEIUSDC ALGOUSDC ENAUSDC ZKUSDC AVAXUSDC LUNCUSDC THEUSDC SYRUPUSDC PIXELUSDC PARTIUSDC DOLOUSDC EIGENUSDC MINAUSDC SAHARAUSDC BERAUSDC FORMUSDC SNXUSDC FILUSDC CGPTUSDC VANRYUSDC SYNUSDC PNUTUSDC ACHUSDC DOGSUSDC COMPUSDC ZAMAUSDC TRXUSDC HOLOUSDC BIOUSDC)
          DATES=(2026-07-23 2026-07-24 2026-07-25 2026-07-26 2026-07-27)
          ROOT="$PWD/fqt_fresh_holdout_20260723_20260727"
          mkdir -p "$ROOT/zips" "$ROOT/csv"
          : > "$ROOT/downloaded.tsv"
          : > "$ROOT/missing.tsv"
          : > "$ROOT/integrity_failures.tsv"
          for pair in "${PAIRS[@]}"; do
            mkdir -p "$ROOT/zips/$pair" "$ROOT/csv/$pair"
            for day in "${DATES[@]}"; do
              name="${pair}-1m-${day}.zip"
              base="https://data.binance.vision/data/spot/daily/klines/${pair}/1m/${name}"
              if curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 20 -o "$ROOT/zips/$pair/$name" "$base" && \
                 curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 20 -o "$ROOT/zips/$pair/$name.CHECKSUM" "$base.CHECKSUM"; then
                if (cd "$ROOT/zips/$pair" && sha256sum -c "$name.CHECKSUM"); then
                  unzip -q -p "$ROOT/zips/$pair/$name" > "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/downloaded.tsv"
                else
                  printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/integrity_failures.tsv"
                  rm -f "$ROOT/csv/$pair/${pair}-1m-${day}.csv"
                fi
              else
                printf '%s\t%s\t%s\n' "$pair" "$day" "$name" >> "$ROOT/missing.tsv"
                rm -f "$ROOT/zips/$pair/$name" "$ROOT/zips/$pair/$name.CHECKSUM"
              fi
            done
          done
          python - <<'PY'
          import csv, hashlib, json, pathlib
          root = pathlib.Path('fqt_fresh_holdout_20260723_20260727')
          def rows(name):
              p=root/name
              if not p.exists(): return []
              with p.open() as f: return [line.rstrip('\n').split('\t') for line in f if line.strip()]
          csv_files=sorted((root/'csv').glob('*/*.csv'))
          manifest={
              'source':'https://data.binance.vision/data/spot/daily/klines',
              'dates':['2026-07-23','2026-07-24','2026-07-25','2026-07-26','2026-07-27'],
              'pair_count':31,
              'expected_files':155,
              'downloaded_files':len(rows('downloaded.tsv')),
              'missing_files':len(rows('missing.tsv')),
              'integrity_failures':len(rows('integrity_failures.tsv')),
              'csv_files':len(csv_files),
              'files':[]
          }
          for p in csv_files:
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              manifest['files'].append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':h})
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({k:manifest[k] for k in ('expected_files','downloaded_files','missing_files','integrity_failures','csv_files')},indent=2))
          PY
          tar -czf fqt-binance-fresh-holdout-20260723-20260727.tar.gz "$ROOT"
          sha256sum fqt-binance-fresh-holdout-20260723-20260727.tar.gz > fqt-binance-fresh-holdout-20260723-20260727.tar.gz.sha256

      - name: Upload verified holdout
        uses: actions/upload-artifact@v4
        with:
          name: fqt-binance-fresh-holdout-20260723-20260727
          path: |
            fqt-binance-fresh-holdout-20260723-20260727.tar.gz
            fqt-binance-fresh-holdout-20260723-20260727.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
